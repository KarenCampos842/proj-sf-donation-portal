<template>
    <section class="history" aria-labelledby="history-title">
        <div class="history__back">
            <lightning-button
                variant="base"
                label={messages.back}
                icon-name="utility:chevronleft"
                onclick={handleBack}
            ></lightning-button>
        </div>

        <header class="history__header">
            <h1 id="history-title" class="history__title">{messages.title}</h1>
            <p class="history__subtitle">{messages.subtitle}</p>
        </header>

        <template lwc:if={isLoading}>
            <div class="state state--loading" role="status">
                <lightning-spinner size="medium" alternative-text={messages.loading}></lightning-spinner>
            </div>
        </template>

        <template lwc:if={hasError}>
            <div class="state" role="alert">
                <p class="state__message">{messages.error}</p>
                <lightning-button label={messages.retry} onclick={handleRetry}></lightning-button>
            </div>
        </template>

        <template lwc:if={isEmpty}>
            <p class="state state__message" role="status">{messages.empty}</p>
        </template>

        <template lwc:if={hasCampaigns}>
            <p class="history__count" role="status">{countText}</p>
            <ul class="grid" aria-label={messages.listLabel}>
                <template for:each={campaigns} for:item="campaign">
                    <li key={campaign.id} class="grid__item">
                        <article class="card">
                            <div class="media">
                                <template lwc:if={campaign.hasImage}>
                                    <img
                                        class="media__image"
                                        src={campaign.imageUrl}
                                        alt={campaign.imageAlt}
                                        loading="lazy"
                                        data-id={campaign.id}
                                        onerror={handleImageError}
                                    />
                                </template>
                                <template lwc:else>
                                    <div class="media__placeholder" role="img" aria-label={campaign.placeholderLabel}>
                                        <lightning-icon icon-name="utility:image" size="large" aria-hidden="true"></lightning-icon>
                                    </div>
                                </template>
                            </div>

                            <div class="card__body">
                                <div class="card__tags">
                                    <span class={campaign.badgeClass}>{campaign.badgeLabel}</span>
                                </div>

                                <h2 class="card__title">
                                    <button
                                        type="button"
                                        class="card__link"
                                        data-id={campaign.id}
                                        aria-label={campaign.actionLabel}
                                        onclick={handleSelect}
                                    >
                                        {campaign.name}
                                    </button>
                                </h2>

                                <dl class="results">
                                    <div class="results__item">
                                        <dt class="results__label">{messages.totalLabel}</dt>
                                        <dd class="results__value results__value_total">{campaign.totalText}</dd>
                                    </div>
                                    <div class="results__item">
                                        <dt class="results__label">{messages.goalLabel}</dt>
                                        <dd class="results__value">{campaign.goalText}</dd>
                                    </div>
                                </dl>

                                <p class="card__meta">
                                    <span class="card__percent">{campaign.percentText}</span>
                                    <template lwc:if={campaign.isGoalReached}>
                                        <span class="card__reached">{goalReachedText}</span>
                                    </template>
                                </p>

                                <template lwc:if={campaign.donationText}>
                                    <p class="card__note">{campaign.donationText}</p>
                                </template>

                                <template lwc:if={campaign.closedOnText}>
                                    <p class="card__note">{campaign.closedOnText}</p>
                                </template>

                                <p class="card__cta" aria-hidden="true">{viewDetailText} →</p>
                            </div>
                        </article>
                    </li>
                </template>
            </ul>
        </template>
    </section>
</template>
